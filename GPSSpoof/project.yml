name: GPSSpoof
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "15.0"
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${TEAM_ID}
    SWIFT_VERSION: "5.0"
targets:
  GPSSpoof:
    type: application
    platform: iOS
    sources:
      - path: GPSSpoof
        excludes:
          - "locations/.gitkeep"
    info:
      path: GPSSpoof/Info.plist
      properties:
        CFBundleIdentifier: com.local.gpsspoof
        CFBundleName: GPSSpoof
        MinimumOSVersion: "15.0"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Without a launch-screen entry iOS runs the app letterboxed in
        # legacy compatibility mode instead of giving it the full screen.
        # An empty dict opts into a plain full-screen launch.
        UILaunchScreen: {}
        # Background location keepalive: keeps the debuggee process (and with
        # it the Xcode location-simulation session) alive while the phone is
        # locked. Plain Info.plist keys — no paid-account entitlement needed.
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: Keeps the location-simulation debug session alive while the phone is locked.
        # Phone-control channel: the app POSTs cleartext HTTP to the helper
        # on the Mac's LAN IP. Both keys are plain plist entries.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Sends new spoof coordinates to the helper running on your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.gpsspoof
        TARGETED_DEVICE_FAMILY: "1,2"
    # We manage the scheme manually so xcodegen does not overwrite our
    # custom LocationScenario reference. See xcschemes/GPSSpoof.xcscheme.
    scheme: ~
  # Mac-side phone-control helper. A plain command-line tool: listens for
  # HTTP POSTs from the iPhone app and re-points Xcode's running location
  # simulation. Built by spoof.sh via `xcodebuild -target GPSSpoofHelper`;
  # code signing is disabled because it only ever runs on this Mac.
  GPSSpoofHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
        PRODUCT_NAME: GPSSpoofHelper
    scheme: ~
schemes: {}
